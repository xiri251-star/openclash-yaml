# 机场节点订阅

proxy-providers:

  机场名称:
    url: "https://xxl.m2-koala.sbs/s/eba3d9891accf1476a26603bb161b5d0"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 主要端口设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895

allow-lan: true
mode: rule
log-level: info

external-controller: 0.0.0.0:9090
# external-ui: ui
# external-ui-name: zashboard
# external-ui-url: https://gh-proxy.com/GitHub.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.20.0.1/16
  nameserver:
    - 223.5.5.5
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn

ipv6: false

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: false
  auto-detect-interface: false
  auto-redirect: false
  strict-route: false

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - 直连
    - 所有-故转
    - 所有-高速
    - 香港-故转
    - 香港-高速
    - 台湾-故转
    - 台湾-高速
    - 日本-故转
    - 日本-高速
    - 新加坡-故转
    - 新加坡-高速
    - 美国-故转
    - 美国-高速
    - 其他-故转
    - 其他-高速
    - 拒绝

proxy-groups:

  # 业务分流组

  - {name: AI, <<: *default}
  - {name: YouTube, <<: *default}
  - {name: Google, <<: *default}
  - {name: GitHub, <<: *default}
  - {name: Pixiv, <<: *default}
  - {name: Telegram, <<: *default}
  - {name: WhatsApp, <<: *default}
  - {name: X, <<: *default}
  - {name: Discord, <<: *default}
  - {name: Facebook, <<: *default}
  - {name: Instagram, <<: *default}
  - {name: Games, <<: *default}
  - {name: Block, <<: *default}
  - {name: 国外, <<: *default}
  - {name: 国内, <<: *default}
  - {name: 其他, <<: *default}

  # 所有 组：故障转移 / 高速 两档并列

  - name: 所有-故转
    type: fallback
    include-all: true
    interval: 180
    lazy: false
    filter: "^((?!(直连|拒绝)).)*$"

  - name: 所有-高速
    type: url-test
    include-all: true
    interval: 300
    url: https://www.gstatic.com/generate_204
    tolerance: 50
    lazy: false
    filter: "^((?!(直连|拒绝)).)*$"

  # 香港 组：故障转移 / 高速 两档并列

  - name: 香港-故转
    type: fallback
    include-all: true
    interval: 180
    lazy: false
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  - name: 香港-高速
    type: url-test
    include-all: true
    interval: 300
    url: https://www.gstatic.com/generate_204
    tolerance: 50
    lazy: false
    filter: "(?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$"

  # 台湾 组：故障转移 / 高速 两档并列

  - name: 台湾-故转
    type: fallback
    include-all: true
    interval: 180
    lazy: false
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"

  - name: 台湾-高速
    type: url-test
    include-all: true
    interval: 300
    url: https://www.gstatic.com/generate_204
    tolerance: 50
    lazy: false
    filter: "(?=.*(广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan)).*$"

  # 日本 组：故障转移 / 高速 两档并列

  - name: 日本-故转
    type: fallback
    include-all: true
    interval: 180
    lazy: false
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  - name: 日本-高速
    type: url-test
    include-all: true
    interval: 300
    url: https://www.gstatic.com/generate_204
    tolerance: 50
    lazy: false
    filter: "(?=.*(广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan)).*$"

  # 新加坡 组：故障转移 / 高速 两档并列

  - name: 新加坡-故转
    type: fallback
    include-all: true
    interval: 180
    lazy: false
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"

  - name: 新加坡-高速
    type: url-test
    include-all: true
    interval: 300
    url: https://www.gstatic.com/generate_204
    tolerance: 50
    lazy: false
    filter: "(?=.*(广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$"

  # 美国 组：故障转移 / 高速 两档并列

  - name: 美国-故转
    type: fallback
    include-all: true
    interval: 180
    lazy: false
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

  - name: 美国-高速
    type: url-test
    include-all: true
    interval: 300
    url: https://www.gstatic.com/generate_204
    tolerance: 50
    lazy: false
    filter: "(?=.*(广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).*$"

  # 其他 组：故障转移 / 高速 两档并列

  - name: 其他-故转
    type: fallback
    include-all: true
    interval: 180
    lazy: false
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).)*$"

  - name: 其他-高速
    type: url-test
    include-all: true
    interval: 300
    url: https://www.gstatic.com/generate_204
    tolerance: 50
    lazy: false
    filter: "^((?!(直连|拒绝|广港|香港|HK|Hong Kong|🇭🇰|HongKong|广台|台湾|台灣|TW|Tai Wan|🇹🇼|🇨🇳|TaiWan|Taiwan|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore|广美|US|美国|纽约|波特兰|达拉斯|俄勒|凤凰城|费利蒙|洛杉|圣何塞|圣克拉|西雅|芝加|🇺🇸|United States)).)*$"

